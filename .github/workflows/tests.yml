name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Тесты не требуют ultralytics/torch — ставим только лёгкие зависимости.
      - run: pip install numpy opencv-python-headless Pillow requests -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
